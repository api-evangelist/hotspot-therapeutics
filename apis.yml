aid: hotspot-therapeutics
name: HotSpot Therapeutics
description: 'HotSpot Therapeutics is a clinical-stage biopharmaceutical company headquartered
  in Boston, Massachusetts, pioneering allosteric drug discovery by targeting "natural
  hotspots" — the regulatory on/off switches on proteins. Its Smart Allostery platform
  combines AI-driven mining of large, diverse structural and biological data sets with
  a tailored pharmacology toolkit and bespoke medicinal chemistry to design first-in-class
  oral small molecules, and has been applied across E3 ligases, kinases and transcription
  factors. The company has raised roughly $190M across Series A, B and C financings and
  advanced its lead candidate HST-1011, an oral allosteric CBL-B inhibitor, into first-in-human
  dosing for cancer, alongside programs in autoimmune disease. HotSpot sells medicines
  and research collaborations, not software: it publishes no public developer program,
  API, SDK or machine-readable contract of any kind.'
